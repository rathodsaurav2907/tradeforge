[tool.poetry]
name = "tradeforge-analytics"
version = "1.0.0"
description = "TradeForge Quantitative & AI Analytics Microservice using Pandas & NumPy"
authors = ["Saurav Rathod <rathodsaurav2907@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "analytics"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.110.0"
uvicorn = {extras = ["standard"], version = ">=0.28.0"}
pandas = ">=2.2.0"
numpy = ">=1.26.0"
pydantic = ">=2.6.0"
requests = ">=2.31.0"
python-dotenv = ">=1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
