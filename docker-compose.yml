version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tradeforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tradeforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    container_name: tradeforge-analytics
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradeforge-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/tradeforge
      - ANALYTICS_URL=http://analytics:8000
      - JWT_SECRET=tradeforge_super_secure_jwt_token_2026
    depends_on:
      - postgres
      - analytics

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradeforge-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
